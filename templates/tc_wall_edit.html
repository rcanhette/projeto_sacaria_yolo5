<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Editar painel grande</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#002F54; --card:#ffffff; --muted:#6B7280; --text:#002F54;
      --accent:#22c55e; --accent-weak:#16a34a; --border:#e5e7eb;
      --danger:#ef4444; --danger-weak:#dc2626;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
      background:#f8fafc;
      color:var(--text);
      min-height:100vh;
    }
    .wrap{
      padding:16px;
      max-width:800px;
      margin:0 auto;
    }
    .title-page{
      font-weight:800;
      font-size:20px;
      letter-spacing:.02em;
      margin:10px 4px 16px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 4px 16px rgba(0,0,0,.08);
      padding:16px 20px;
      margin-bottom:16px;
    }
    .card-title{
      font-weight:700;
      margin-bottom:12px;
      font-size:16px;
    }
    .form-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:10px;
      align-items:center;
    }
    .label{
      font-size:13px;
      color:var(--muted);
      min-width:80px;
    }
    .input, .select{
      padding:8px 10px;
      border-radius:10px;
      border:1px solid var(--border);
      font-size:14px;
      min-width:140px;
    }
    .btn{
      appearance:none;
      border-radius:10px;
      border:1px solid var(--border);
      padding:8px 12px;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      background:#fff;
      color:#111827;
      transition:.15s ease;
    }
    .btn-primary{
      background:var(--accent);
      color:#062b16;
      border-color:transparent;
    }
    .btn-primary:hover{ background:var(--accent-weak); }
    .btn-secondary{
      background:#e5e7eb;
      color:#111827;
      border-color:#d1d5db;
    }
    .btn-secondary:hover{
      background:#d1d5db;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
    }
  </style>
</head>
<body>
  {% include '_navbar.html' %}
  <div class="wrap">
    {% include '_flash.html' %}
    <div class="title-page">Editar painel grande</div>

    <section class="card">
      <div class="card-title">Painel {{ layout.id }} - {{ layout.name }}</div>
      <form method="post" action="{{ url_for('tc.tc_wall_edit', layout_id=layout.id) }}">
        <input type="hidden" name="action" value="update" />
        <div class="form-row">
          <label class="label" for="name">Nome da tela</label>
          <input class="input" id="name" name="name" value="{{ layout.name }}" required />
        </div>
        <div class="form-row">
          <label class="label" for="left_tc_id">Lado esquerdo</label>
          <select class="select" id="left_tc_id" name="left_tc_id">
            <option value="">(nenhuma)</option>
            {% for ct in tcs %}
            <option value="{{ ct.id }}" {% if layout.left_tc_id == ct.id %}selected{% endif %}>{{ ct.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-row">
          <label class="label" for="right_tc_id">Lado direito</label>
          <select class="select" id="right_tc_id" name="right_tc_id">
            <option value="">(nenhuma)</option>
            {% for ct in tcs %}
            <option value="{{ ct.id }}" {% if layout.right_tc_id == ct.id %}selected{% endif %}>{{ ct.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="hint">
          Você pode deixar um dos lados vazio. Pelo menos um lado deve ter uma TC.
        </div>
        <div style="margin-top:10px; display:flex; gap:8px;">
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
          <a href="{{ url_for('tc.tc_wall_config') }}" class="btn btn-secondary">Voltar</a>
          <a href="{{ url_for('tc.tc_wall_screen', layout_id=layout.id) }}" class="btn btn-secondary" target="_blank">Visualizar painel</a>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
