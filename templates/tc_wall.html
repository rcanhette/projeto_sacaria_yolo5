<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Painel Grande - TCs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
    }
    body {
      display: flex;
      flex-direction: column;
      background: #000;
      color: #fff;
    }
    .top-bar {
      padding: 6px 12px;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .top-label {
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: 11px;
      color: #9ca3af;
    }
    .select {
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
    }
    .select:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 1px;
    }
    .hint {
      font-size: 11px;
      color: #9ca3af;
    }
    .wall {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .panel {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      transition: background-color .2s ease;
      background: #7f1d1d; /* vermelho parado */
      position: relative;
    }
    .panel + .panel {
      border-left: 2px solid rgba(15,23,42,0.85);
    }
    .panel.on {
      background: #14532d; /* verde operando */
    }
    .panel.off {
      background: #7f1d1d;
    }
    .tc-name {
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: min(3vw, 26px);
      margin-bottom: 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }
    .tc-status {
      font-size: 14px;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #e5e7eb;
      opacity: 0.9;
    }
    .tc-count {
      font-weight: 900;
      font-size: min(18vw, 160px);
      line-height: 1;
      letter-spacing: .06em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }
    .tc-extra {
      margin-top: 10px;
      font-size: 13px;
      color: #e5e7eb;
      opacity: 0.9;
    }
    .tc-extra span + span {
      margin-left: 12px;
    }
    @media (max-width: 900px) {
      .wall {
        flex-direction: column;
      }
      .panel + .panel {
        border-left: none;
        border-top: 2px solid rgba(15,23,42,0.85);
      }
      .tc-name {
        font-size: 18px;
      }
      .tc-count {
        font-size: 96px;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="top-label">Painel grande</div>
      <div class="hint">Escolha qual TC aparece em cada lado. Use o navegador em tela cheia (F11) para um monitor dedicado.</div>
    </div>
    <div class="top-bar-right">
      <div>
        <span class="top-label">Lado esquerdo</span>
        <select id="select-left" class="select">
          <option value="">(nenhuma)</option>
          {% for ct in cts %}
          <option value="{{ ct.id }}">{{ ct.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <span class="top-label">Lado direito</span>
        <select id="select-right" class="select">
          <option value="">(nenhuma)</option>
          {% for ct in cts %}
          <option value="{{ ct.id }}">{{ ct.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="wall">
    <section class="panel off" id="panel-left" data-side="left">
      <div class="tc-name" data-role="name">TC -</div>
      <div class="tc-status" data-role="status">Parada</div>
      <div class="tc-count" data-role="count">0</div>
      <div class="tc-extra">
        <span data-role="lote"></span>
        <span data-role="alvo"></span>
      </div>
    </section>
    <section class="panel off" id="panel-right" data-side="right">
      <div class="tc-name" data-role="name">TC -</div>
      <div class="tc-status" data-role="status">Parada</div>
      <div class="tc-count" data-role="count">0</div>
      <div class="tc-extra">
        <span data-role="lote"></span>
        <span data-role="alvo"></span>
      </div>
    </section>
  </div>
  <script>
    (function(){
      const leftSelect = document.getElementById('select-left');
      const rightSelect = document.getElementById('select-right');
      const panels = {
        left: document.getElementById('panel-left'),
        right: document.getElementById('panel-right'),
      };
      const sources = { left: null, right: null };

      function formatInt(v){
        if (v == null || isNaN(v)) return '0';
        try {
          return parseInt(v, 10).toLocaleString('pt-BR');
        } catch(e){
          return String(parseInt(v, 10) || 0);
        }
      }

      function updatePanel(side, payload){
        const panel = panels[side];
        if (!panel) return;
        const nameEl = panel.querySelector('[data-role=\"name\"]');
        const statusEl = panel.querySelector('[data-role=\"status\"]');
        const countEl = panel.querySelector('[data-role=\"count\"]');
        const loteEl = panel.querySelector('[data-role=\"lote\"]');
        const alvoEl = panel.querySelector('[data-role=\"alvo\"]');

        const active = !!payload.session_active || (String(payload.db_status || '').toLowerCase() === 'operando' || String(payload.db_status || '').toLowerCase() === 'ativo');
        panel.classList.toggle('on', active);
        panel.classList.toggle('off', !active);
        if (statusEl){
          statusEl.textContent = active ? 'Operando' : 'Parada';
        }
        if (countEl){
          countEl.textContent = formatInt(payload.count);
        }
        if (loteEl){
          const lote = (payload.lote || '').trim();
          loteEl.textContent = lote ? ('Lote: ' + lote) : '';
        }
        if (alvoEl){
          const alvo = payload.contagem_alvo;
          alvoEl.textContent = (alvo != null) ? ('Alvo: ' + formatInt(alvo)) : '';
        }
      }

      function setPanelTitle(side, tcId){
        const panel = panels[side];
        if (!panel) return;
        const nameEl = panel.querySelector('[data-role=\"name\"]');
        if (!nameEl) return;
        if (!tcId){
          nameEl.textContent = 'TC -';
          return;
        }
        const opt = (side === 'left' ? leftSelect : rightSelect).querySelector('option[value=\"' + tcId + '\"]');
        if (opt){
          nameEl.textContent = opt.textContent;
        } else {
          nameEl.textContent = 'TC ' + tcId;
        }
      }

      function clearPanel(side){
        const panel = panels[side];
        if (!panel) return;
        panel.classList.remove('on');
        panel.classList.add('off');
        const nameEl = panel.querySelector('[data-role=\"name\"]');
        const statusEl = panel.querySelector('[data-role=\"status\"]');
        const countEl = panel.querySelector('[data-role=\"count\"]');
        const loteEl = panel.querySelector('[data-role=\"lote\"]');
        const alvoEl = panel.querySelector('[data-role=\"alvo\"]');
        if (nameEl) nameEl.textContent = 'TC -';
        if (statusEl) statusEl.textContent = 'Parada';
        if (countEl) countEl.textContent = '0';
        if (loteEl) loteEl.textContent = '';
        if (alvoEl) alvoEl.textContent = '';
      }

      function attachSSE(side, tcId){
        if (sources[side]){
          try { sources[side].close(); } catch(e){}
          sources[side] = null;
        }
        if (!tcId){
          clearPanel(side);
          return;
        }
        setPanelTitle(side, tcId);
        clearPanel(side);
        try {
          const es = new EventSource('/sse/tc/' + encodeURIComponent(tcId));
          sources[side] = es;
          es.onmessage = function(ev){
            try {
              const data = JSON.parse(ev.data || '{}');
              updatePanel(side, data);
            } catch(e){}
          };
          es.onerror = function(){
            // Em caso de erro, apenas marca parada visualmente.
            clearPanel(side);
          };
        } catch(e){
          clearPanel(side);
        }
      }

      function restoreSelections(){
        try {
          const raw = window.localStorage.getItem('tc_wall_selection');
          if (!raw) return;
          const obj = JSON.parse(raw);
          if (obj.left && leftSelect){
            leftSelect.value = String(obj.left);
          }
          if (obj.right && rightSelect){
            rightSelect.value = String(obj.right);
          }
        } catch(e){}
      }

      function persistSelections(){
        try {
          const data = {
            left: leftSelect ? leftSelect.value || null : null,
            right: rightSelect ? rightSelect.value || null : null,
          };
          window.localStorage.setItem('tc_wall_selection', JSON.stringify(data));
        } catch(e){}
      }

      if (leftSelect){
        leftSelect.addEventListener('change', function(){
          const v = this.value || '';
          persistSelections();
          attachSSE('left', v || null);
        });
      }
      if (rightSelect){
        rightSelect.addEventListener('change', function(){
          const v = this.value || '';
          persistSelections();
          attachSSE('right', v || null);
        });
      }

      restoreSelections();
      if (leftSelect && leftSelect.value){
        attachSSE('left', leftSelect.value);
      }
      if (rightSelect && rightSelect.value){
        attachSSE('right', rightSelect.value);
      }
    })();
  </script>
</body>
</html>
